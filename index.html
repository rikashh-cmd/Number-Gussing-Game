<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number Guessing Game.</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">?</div>
    <p class="eyebrow">A little game of chance</p>
    <h1>Guess the Number</h1>
    <p class="intro">I’m thinking of a number from <strong>1 to 100</strong>. Can you find it?</p>

    <form id="guess-form">
      <label for="guess-input">Your guess</label>
      <div class="input-row">
        <input id="guess-input" type="number" min="1" max="100" placeholder="Enter 1–100" required>
        <button type="submit">Guess</button>
      </div>
    </form>

    <p id="message" class="message" role="status" aria-live="polite">Make your first guess!</p>
    <p class="attempts">Attempts: <span id="attempt-count">0</span></p>
    <button id="reset-button" class="reset" type="button">Start a new game</button>
  </main>
</body>
</html>
